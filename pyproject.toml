[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-pass"
version = "0.3.0"
description = "Zero-trace adversarial QA and stress-testing framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Justin Nimmo"}]
dependencies = []

[project.scripts]
chaos-pass = "chaos_pass.cli:main"

[tool.setuptools.packages.find]
include = ["chaos_pass*"]